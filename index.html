<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camry 保養記錄</title>
<style>
:root {
  --bg: #fafaf8; --fg: #1d1d1b; --muted: #77756f; --line: #e4e2dc;
  --card: #ffffff; --accent: #c0392b; --ok: #2e7d4f; --warn: #b7791f;
  --bar: 52px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --fg: #ecebe6; --muted: #98968f; --line: #2c2c2a;
          --card: #1d1d1b; --accent: #ef6b5b; --ok: #5fbf88; --warn: #e0a84a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }

/* 固定標題列 */
.bar { position: sticky; top: 0; z-index: 30; height: var(--bar); background: var(--bg);
  border-bottom: 1px solid var(--line); }
.bar > div { max-width: 1100px; margin: 0 auto; height: 100%; padding: 0 16px;
  display: flex; align-items: center; gap: 16px; }
.bar h1 { font-size: 18px; margin: 0; white-space: nowrap; }
.bar .next { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 28px 0 8px; letter-spacing: .04em; }
#drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center;
  color: var(--muted); font-size: 13px; }
#drop.over { border-color: var(--fg); color: var(--fg); background: var(--card); }

/* 表格：每列一行、欄位可移動、表頭固定 */
table { width: 100%; border-collapse: collapse; background: var(--card);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
  white-space: nowrap; font-size: 14px; }
thead th { position: sticky; top: var(--bar); z-index: 10; background: var(--card);
  color: var(--muted); font-weight: 500; font-size: 12px; user-select: none; }
th[draggable="true"] { cursor: grab; }
th.dragover { box-shadow: inset 2px 0 0 var(--fg); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.fill { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
input.km[type=date] { width: 150px; }
#drop button { margin-left: 8px; }
a.f { color: var(--fg); }
input.km { width: 110px; font: inherit; font-size: 13px; padding: 3px 8px; margin-right: 6px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
td .s, .s { color: var(--muted); font-size: 12px; }
tr.click { cursor: pointer; } tr.click:hover td { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.mv { border: 0; padding: 0 3px; font-size: 13px; color: var(--muted); background: none; opacity: .35; cursor: pointer; }
th:hover .mv { opacity: 1; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.detail td { background: var(--bg); padding: 4px 12px 8px 24px; white-space: normal; }
.item { display: flex; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; white-space: nowrap; }
.item + .item { border-top: 1px solid var(--line); }
.item .n { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.item .p { color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.badge.done { color: var(--ok); border-color: var(--ok); }
button { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg); }
button:hover { border-color: var(--fg); }
button.del { color: var(--accent); }
td.ops { text-align: right; } td.ops button + button { margin-left: 6px; }
dl.kv { display: grid; grid-template-columns: repeat(3, max-content minmax(0, 1fr)); gap: 6px 14px; margin: 0; padding: 10px 12px;
  background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
dl.kv dt { color: var(--muted); font-size: 13px; white-space: nowrap; }
dl.kv dd { margin: 0 12px 0 0; font-size: 14px; }
@media (max-width: 860px) { dl.kv { grid-template-columns: repeat(2, max-content minmax(0, 1fr)); } }
@media (max-width: 520px) { dl.kv { grid-template-columns: max-content minmax(0, 1fr); } }
dl.kv dd.todo { color: var(--muted); }
ol.plan { margin: 0; padding: 10px 12px 10px 32px; background: var(--card); font-size: 14px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
ol.plan li + li { margin-top: 4px; }
p.sum { margin: 12px 0 8px; font-size: 14px; }
.res.ok { color: var(--ok); } .res.part { color: var(--warn); } .res.miss { color: var(--accent); } .res.next { color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg);
  color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; display: none;
  gap: 12px; align-items: center; max-width: calc(100% - 32px); z-index: 40; }
#toast button { color: var(--bg); border-color: var(--bg); }
footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
footer a { color: inherit; cursor: pointer; text-decoration: underline; }

/* 窄螢幕：表格可左右捲動，仍不換行 */
@media (max-width: 760px) {
  .tw { overflow-x: auto; }
  thead th { position: static; }
  td.fill { max-width: none; overflow: visible; }
  .bar .next { display: none; }
}
</style>
</head>
<body>
<div class="bar"><div><h1>Camry 保養記錄</h1><span class="next" id="next"></span></div></div>
<main>
  <div id="drop">把單據拖到這裡，一個檔案就是一單 <button id="newBlank">＋ 空白一單</button></div>

  <section id="pendingSec" hidden>
    <h2>待確認（核對日期和里程，按確認歸入單據）</h2>
    <div class="tw" id="pending"></div>
  </section>

  <h2>單據（每個里程一單，點一列展開）</h2>
  <div class="tw" id="records"></div>

  <h2>車輛參數</h2>
  <dl class="kv" id="car"></dl>

  <h2>保養策略（到報廢）</h2>
  <ol class="plan" id="strategy"></ol>
  <p class="sum" id="planSum"></p>
  <div class="tw" id="check"></div>

  <footer>里程相同即同一筆。刪除需要密碼，只為避免誤刪。<a id="reset">還原初始資料</a></footer>
</main>
<div id="toast"><span id="toastMsg"></span><button id="undo">復原</button></div>

<script src="data.js"></script>
<script>
const KEY = "camry-records-v1", COLS_KEY = "camry-cols-v1", SEEN_KEY = "camry-seed-seen-v1";
// 防誤刪用的簡易密碼（只存雜湊；公開頁面本來就不是安全機制）
const PW_HASH = 3255812791629365;

let recs = load();
let orders = (() => { try { return JSON.parse(localStorage.getItem(COLS_KEY)) || {}; } catch (e) { return {}; } })();
const expanded = new Set();

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const stored = JSON.parse(s);
      // data.js 之後新增的單要補進來；你已刪除的舊單不會復活。
      const seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[61262,68458,75306,81724]"));
      for (const r of window.SEED) if (!seen.has(r.km) && !stored.some(x => x.km === r.km)) stored.push(structuredClone(r));
      for (const r of window.SEED) {
        const i = stored.findIndex(x => x.km === r.km);
        if (r.rev && i >= 0 && (stored[i].rev || 0) < r.rev) stored[i] = { ...structuredClone(r), file: stored[i].file };
      }
      localStorage.setItem(SEEN_KEY, JSON.stringify(window.SEED.map(r => r.km)));
      localStorage.setItem(KEY, JSON.stringify(stored));
      return stored;
    }
  } catch (e) {}
  return structuredClone(window.SEED);
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(recs)); } catch (e) {} }
function saveOrders() { try { localStorage.setItem(COLS_KEY, JSON.stringify(orders)); } catch (e) {} }

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const fmt = n => n.toLocaleString("en-US");
const money = n => (n ? "$" + fmt(n) : "");
// ---- 密碼與刪除 ----
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
// 同一個分頁輸入過一次就不再問
function guard(fn) {
  let ok = false;
  try { ok = sessionStorage.getItem("camry-unlock") === "1"; } catch (e) {}
  if (!ok) {
    const pw = prompt("輸入密碼才能刪除");
    if (pw == null) return;
    if (cyrb53(pw) !== PW_HASH) { alert("密碼不對"); return; }
    try { sessionStorage.setItem("camry-unlock", "1"); } catch (e) {}
  }
  fn();
}

let snapshot = null, toastTimer;
function mutate(msg, fn) {
  snapshot = JSON.stringify(recs);
  fn(); save(); render();
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 8000);
}
document.getElementById("undo").onclick = () => {
  if (!snapshot) return;
  recs = JSON.parse(snapshot); snapshot = null; save(); render();
  document.getElementById("toast").style.display = "none";
};
document.getElementById("reset").onclick = () => guard(() => {
  if (confirm("還原成初始資料？你的修改會消失。"))
    mutate("已還原初始資料", () => { recs = structuredClone(window.SEED); });
});

// ---- 通用表格：欄位可左右移動（按 ‹ › 或拖曳表頭），順序記在瀏覽器 ----
function orderedCols(id, cols) {
  const movable = cols.filter(c => !c.fixed), byKey = Object.fromEntries(movable.map(c => [c.key, c]));
  const out = [];
  for (const k of orders[id] || []) if (byKey[k]) { out.push(byKey[k]); delete byKey[k]; }
  for (const c of movable) if (byKey[c.key]) out.push(c);
  return out.concat(cols.filter(c => c.fixed));
}
function reorder(id, cols, from, to) {
  const keys = orderedCols(id, cols).filter(c => !c.fixed).map(c => c.key);
  const i = keys.indexOf(from), j = keys.indexOf(to);
  if (i < 0 || j < 0 || i === j) return;
  keys.splice(j, 0, keys.splice(i, 1)[0]);
  orders[id] = keys; saveOrders(); render();
}
function step(id, cols, key, dir) {
  const keys = orderedCols(id, cols).filter(c => !c.fixed).map(c => c.key);
  const j = keys.indexOf(key) + dir;
  if (j >= 0 && j < keys.length) reorder(id, cols, key, keys[j]);
}

function table(id, cols, rows, o = {}) {
  const box = document.getElementById(id); box.replaceChildren();
  if (!rows.length) return box.append(h("div", { class: "empty" }, o.empty || "沒有資料"));
  const cs = orderedCols(id, cols);
  const head = h("tr", {}, cs.map(c => h("th", {
    class: c.num ? "num" : "", draggable: !c.fixed,
    ondragstart: e => e.dataTransfer.setData("text/plain", c.key),
    ondragover: e => { if (!c.fixed) { e.preventDefault(); e.currentTarget.classList.add("dragover"); } },
    ondragleave: e => e.currentTarget.classList.remove("dragover"),
    ondrop: e => { e.preventDefault(); if (!c.fixed) reorder(id, cols, e.dataTransfer.getData("text/plain"), c.key); }
  },
    !c.fixed && h("button", { class: "mv", title: "左移", onclick: () => step(id, cols, c.key, -1) }, "‹"),
    c.label,
    !c.fixed && h("button", { class: "mv", title: "右移", onclick: () => step(id, cols, c.key, 1) }, "›"))));
  const body = h("tbody", {});
  for (const r of rows) {
    const key = o.key && o.key(r), open = o.detail && expanded.has(key);
    body.append(h("tr", { class: o.detail ? "click" : "", onclick: o.detail ? () => {
      expanded.has(key) ? expanded.delete(key) : expanded.add(key); render();
    } : null }, cs.map(c => h("td", { class: [c.num && "num", c.fill && "fill", c.fixed && "ops"].filter(Boolean).join(" ") }, c.cell(r)))));
    if (open) body.append(h("tr", { class: "detail" }, h("td", { colspan: cs.length }, o.detail(r))));
  }
  box.append(h("table", {}, h("thead", {}, head), body));
}

// ---- 顯示 ----
function render() {
  recs.sort((a, b) => (a.km || 1e12) - (b.km || 1e12));
  renderNext(); renderPending(); renderRecords(); renderCar(); renderPlan();
}

function renderNext() {
  const last = ranked().reverse().find(r => r.items.some(i => i.status === "done"));
  const el = document.getElementById("next");
  if (!last) { el.textContent = ""; return; }
  const d = new Date(last.date); d.setMonth(d.getMonth() + 6);
  el.textContent = `下次保養約 ${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}（上次 ${last.date} · ${fmt(last.km)} 公里）`;
}

// 原始檔存在這個瀏覽器的 IndexedDB，單上只記檔案 id。
const idb = (() => {
  let db;
  const open = () => db || (db = new Promise((res, rej) => {
    const q = indexedDB.open("camry-files", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("f");
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => {
    const t = d.transaction("f", mode), r = fn(t.objectStore("f"));
    t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error); }); };
  return { put: (k, v) => tx("readwrite", s => s.put(v, k)), get: k => tx("readonly", s => s.get(k)),
    keys: () => tx("readonly", s => s.getAllKeys()), del: k => tx("readwrite", s => s.delete(k)) };
})();
async function openFile(f) {
  let blob; try { blob = await idb.get(f.id); } catch (e) {}
  if (!blob) return alert("原始檔不在這個瀏覽器裡");
  window.open(URL.createObjectURL(blob), "_blank");
}
// 檔名像 20251013_68458_..._NTD5896 時，先帶入日期、里程、金額，仍要你確認。
function guess(name) {
  const m = name.match(/^(\d{4})(\d{2})(\d{2})_(\d{4,6})(?!\d)/), t = name.match(/NTD(\d+)/i);
  return { date: m ? `${m[1]}-${m[2]}-${m[3]}` : "", km: m ? m[4] : "", total: t ? Number(t[1]) : 0 };
}

const hasKm = r => Number.isFinite(r.km) && r.km > 0;
const ranked = () => recs.filter(hasKm).sort((a, b) => a.km - b.km);

function renderPending() {
  const list = recs.filter(r => !hasKm(r));
  document.getElementById("pendingSec").hidden = !list.length;
  table("pending", [
    { key: "what", label: "單據", fill: true, cell: r => r.file
        ? [r.file.name + " ", h("a", { href: "#", class: "f", onclick: e => { e.preventDefault(); openFile(r.file); } }, "開啟")]
        : (r.items.map(i => i.name).join("、") || "（空白單）") },
    { key: "date", label: "日期", cell: r => h("input", { type: "date", class: "km", value: r.draftDate ?? r.date ?? "",
        oninput: e => { r.draftDate = e.target.value; },
        onclick: e => { try { e.target.showPicker(); } catch (x) {} } }) },
    { key: "km", label: "里程", num: true, cell: r => h("input", { type: "number", inputmode: "numeric", class: "km", placeholder: "公里",
        value: r.draftKm ?? "", oninput: e => { r.draftKm = e.target.value; },
        onkeydown: e => { if (e.key === "Enter") confirmDraft(r); } }) },
    { key: "ops", label: "", fixed: true, cell: r => [
      h("button", { onclick: () => confirmDraft(r) }, "確認"),
      h("button", { class: "del", onclick: () => guard(() => mutate("已刪除一張待確認的單", () => { recs = recs.filter(x => x !== r); })) }, "刪除")] }
  ], list);
}

// 里程相同 → 同一單：補上新項目；已有的報價若在新單變成已施作，就更新狀態。
function mergeInto(cur, inc) {
  for (const i of inc.items) {
    const same = cur.items.find(x => x.cat === i.cat && x.name === i.name);
    if (!same) cur.items.push(i);
    else if (same.status === "quote" && i.status === "done") same.status = "done";
  }
  cur.total = cur.total || inc.total; cur.date ||= inc.date; cur.shop ||= inc.shop; cur.no ||= inc.no;
}
function confirmDraft(r) {
  const date = r.draftDate ?? r.date ?? "", km = Number(r.draftKm);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return alert("請選日期");
  if (!Number.isInteger(km) || km <= 0) return alert("請輸入里程（公里）");
  const cur = recs.find(x => x !== r && x.km === km);
  mutate(cur ? `已併入 ${fmt(km)} 公里的單` : `已歸入 ${fmt(km)} 公里`, () => {
    r.date = date; delete r.draftDate; delete r.draftKm;
    if (cur) { cur.file ||= r.file; mergeInto(cur, r); recs = recs.filter(x => x !== r); } else r.km = km;
  });
}

function deleteRecord(r) {
  guard(() => mutate(`已刪除 ${fmt(r.km)} 公里這一單`, () => { recs = recs.filter(x => x !== r); }));
}

function renderCar() {
  const c = window.CAR, P = window.PLAN, last = ranked().at(-1);
  const rows = [
    ["車款", c.model], ["出廠", c.year], ["型式", c.type], ["引擎", c.engine],
    ["排氣量", c.displacement], ["缸數", c.cylinders], ["座位／顏色", c.seats],
    ["火星塞", c.plug], ["使用機油", c.oil],
    ["最近一單", last ? `${fmt(last.km)} 公里（${last.date}）` : null],
    ["保養週期", `每 ${fmt(P.step)} 公里 ± ${fmt(P.tol)}`],
    ["暫定報廢里程", `${fmt(P.scrapKm)} 公里`]];
  const box = document.getElementById("car"); box.replaceChildren();
  for (const [k, v] of rows) box.append(h("dt", {}, k), h("dd", { class: v ? "" : "todo" }, v || "待補"));
}

// 查核點：每 step 公里一個，範圍是 [點−tol, 點+tol)，因此每張單剛好落在一個查核點。
// 從有記錄的第一個查核點起，查到最近一單所在的查核點，再多列下一個。
function checkPoints() {
  const { step, tol } = window.PLAN, rs = ranked();
  if (!rs.length) return [];
  const first = Math.round(rs[0].km / step) * step, last = Math.round(rs.at(-1).km / step) * step;
  const out = [];
  for (let m = first; m <= last + step; m += step) {
    const inWin = rs.filter(r => r.km >= m - tol && r.km < m + tol);
    const state = m > last ? "next" : inWin.some(r => r.items.some(i => i.status === "done")) ? "ok" : inWin.length ? "part" : "miss";
    out.push({ m, lo: m - tol, hi: m + tol - 1, inWin, state });
  }
  return out.reverse();
}

function renderPlan() {
  const P = window.PLAN, pts = checkPoints();
  const ol = document.getElementById("strategy"); ol.replaceChildren(...P.strategy.map(t => h("li", {}, t)));
  const n = k => pts.filter(x => x.state === k).length, last = ranked().at(-1);
  const left = last ? Math.max(0, Math.round((P.scrapKm - last.km) / P.step)) : 0;
  document.getElementById("planSum").textContent = pts.length
    ? `已查核 ${n("ok") + n("part") + n("miss")} 個點：已保養 ${n("ok")}、僅有單 ${n("part")}、缺 ${n("miss")}。距暫定報廢還有約 ${left} 個查核點。` : "";
  const label = { ok: "✓ 已保養", part: "△ 僅有單", miss: "✗ 缺", next: "… 下次" };
  table("check", [
    { key: "m", label: "查核點", num: true, cell: x => fmt(x.m) },
    { key: "range", label: "範圍", cell: x => `${fmt(x.lo)} – ${fmt(x.hi)}` },
    { key: "res", label: "結果", cell: x => h("span", { class: "res " + x.state }, label[x.state]) },
    { key: "recs", label: "對應單據", fill: true, cell: x => x.inWin.length
        ? x.inWin.map(r => `${fmt(r.km)}（${r.km >= x.m ? "+" : "−"}${fmt(Math.abs(r.km - x.m))}，${r.date}）`).join("　") : "—" }
  ], pts, { empty: "還沒有單據可查核" });
}

function renderRecords() {
  table("records", [
    { key: "km", label: "里程", num: true, cell: r => fmt(r.km) },
    { key: "date", label: "日期", cell: r => r.date },
    { key: "shop", label: "廠名", cell: r => r.shop },
    { key: "no", label: "單號", cell: r => r.no || "—" },
    { key: "total", label: "金額", num: true, cell: r => money(r.total) || "—" },
    { key: "n", label: "項目數", num: true, cell: r => r.items.length },
    { key: "file", label: "原始檔", cell: r => r.file ? h("a", { href: "#", class: "f", onclick: e => { e.preventDefault(); e.stopPropagation(); openFile(r.file); } }, r.file.name) : "—" },
    { key: "ops", label: "", fixed: true, cell: r => h("button", { class: "del", onclick: e => {
      e.stopPropagation(); deleteRecord(r);
    } }, "刪除這單") }
  ], ranked().reverse(), {
    key: r => r.km,
    detail: r => [h("div", { class: "item" }, h("span", { class: "n s" }, r.items.length ? "明細" : "尚無明細"),
      h("button", { class: "del", onclick: () => deleteRecord(r) }, "刪除這一單")),
    ...r.items.map(i => h("div", { class: "item" },
      h("span", { class: "badge " + i.status }, i.status === "done" ? "已施作" : "報價"),
      h("span", { class: "n" }, i.name),
      h("span", { class: "p" }, money(i.price)),
      h("button", { class: "del", onclick: () => guard(() => mutate("已刪除一項", () => { r.items = r.items.filter(x => x !== i); })) }, "刪")))]
  });
}

// ---- 拖入 ----
const drop = document.getElementById("drop");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async ev => {
  const drafts = [];
  for (const f of [...ev.dataTransfer.files]) {
    if (/\.json$/i.test(f.name)) {
      try { importJson(JSON.parse(await f.text())); } catch (e) { alert(`${f.name} 不是有效的記錄檔`); }
      continue;
    }
    const id = (crypto.randomUUID && crypto.randomUUID()) || Date.now() + "-" + Math.random().toString(36).slice(2);
    try { await idb.put(id, f); } catch (e) {}
    const g = guess(f.name);
    drafts.push({ km: null, date: null, shop: "", no: "", total: g.total, items: [],
      file: { id, name: f.name, type: f.type }, draftDate: g.date, draftKm: g.km });
  }
  if (drafts.length) mutate(`已加入 ${drafts.length} 張待確認的單`, () => { recs.push(...drafts); });
});
document.getElementById("newBlank").onclick = () => {
  recs.push({ km: null, date: null, shop: "", no: "", total: 0, items: [] }); save(); render();
};

function importJson(data) {
  const list = Array.isArray(data) ? data : [data];
  mutate(`已匯入 ${list.length} 筆`, () => {
    for (const inc of list) {
      const cur = hasKm(inc) ? recs.find(r => r.km === inc.km) : null;
      if (cur) mergeInto(cur, inc); else recs.push(inc);
    }
  });
}

render();
idb.keys().then(ks => { const used = new Set(recs.map(r => r.file && r.file.id)); ks.filter(k => !used.has(k)).forEach(k => idb.del(k)); }).catch(() => {});
</script>
